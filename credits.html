<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 18px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #141416;
      color: #f8fafc;
      margin: 0;
      text-align: center;
    }
    .logo-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, rgba(131,58,180,0.25), rgba(253,29,29,0.25), rgba(252,176,69,0.25));
      border: 1px solid rgba(225, 48, 108, 0.45);
      color: #f9a8d4;
      margin-bottom: 10px;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 17px;
      font-weight: 800;
      background: linear-gradient(90deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .version {
      font-size: 12px;
      color: #71717a;
      margin-bottom: 16px;
    }
    .card {
      background: #1c1c21;
      border: 1px solid #2b2b33;
      border-radius: 10px;
      padding: 14px 12px;
      margin-bottom: 14px;
    }
    .made-with {
      font-size: 13px;
      color: #e4e4e7;
      margin-bottom: 4px;
    }
    .author {
      font-size: 16px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.3px;
    }
    .sub-lines {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2b2b33;
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.5;
    }
    .back-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 8px;
      border-radius: 8px;
      background: #25252b;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #383842;
      transition: background 0.15s ease;
    }
    .back-btn:hover {
      background: #32323a;
    }
  </style>
</head>
<body>
  <div class="logo-badge">CHROME EXTENSION</div>
  <h2>Instagram Magnifier PRO</h2>
  <div class="version">Version 1.0 • Release Build</div>

  <div class="card">
    <div class="made-with">Made with ❤️ by</div>
    <div class="author">Yashvir Gaming</div>

    <div class="sub-lines">
      High-Resolution Hover Zoom &bull; Wheel Scaling<br>
      Instant Media Downloader &bull; Custom Pro Themes<br>
      Built for Chrome Manifest V3
    </div>
  </div>

  <a href="popup.html" class="back-btn">&larr; Back to Settings</a>
</body>
</html>
